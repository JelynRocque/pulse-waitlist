[build]
  publish = "."
  command = ""

# Invite links shared before the home page launched look like
# pulseskin.co/?ref=CODE. Send them to the waitlist with the code intact.
[[redirects]]
  from = "/"
  to = "/waitlist/?ref=:ref"
  query = { ref = ":ref" }
  status = 301
  force = true

# Invite links from the app's share cards and friend invites: pulseskin.co/join/CODE.
# Until the app is public they land on the waitlist with the code kept as ?ref=, so the friend is credited.
[[redirects]]
  from = "/join/:code"
  to = "/waitlist/?ref=:code"
  status = 302
  force = true

# Friends-and-family test: invite-only, never indexed, camera allowed only on this origin.
[[headers]]
  for = "/test/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(self)"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
