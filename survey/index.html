<style>
  :root {
    --warm-white: #FFFBF7;
    --paper: #FFF3E8;
    --espresso: #261000;
    --espresso-soft: #5B4436;
    --auburn: #96262C;
    --burnt-orange: #AB5B1E;
    --gold: #E4A524;
    --line: #E7D6C8;
    --grad: linear-gradient(135deg, #81261A 0%, #AA5B1E 52%, #D79423 100%);
    --display: "Romie", "Gilda Display", "Didot", "Bodoni 72", Georgia, serif;
    --body: "Raleway", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--warm-white); color: var(--espresso);
    font-family: var(--body); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .wrap { max-width: 640px; margin: 0 auto; padding-inline: 20px; }

  header.top { padding-block: 20px; border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .wordmark { display: inline-flex; align-items: center; gap: 10px; color: #191819; text-decoration: none; }
  .wordmark-icon { height: 32px; width: auto; display: block; flex: none; }
  @media (max-width: 480px) { .wordmark-icon { height: 27px; } }
  .wordmark-svg { height: 22px; width: auto; display: block; }
  .step-count { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--espresso-soft); font-variant-numeric: tabular-nums; }

  .progress { height: 4px; background: var(--line); }
  .progress i { display: block; height: 100%; width: 0; background: var(--grad); transition: width .25s ease; }

  main { padding-block: 36px 48px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--burnt-orange); margin: 0 0 12px; }
  h1, h2.q {
    font-family: var(--display); font-weight: 400; line-height: 1.12;
    margin: 0 0 10px; text-wrap: balance;
  }
  h1 { font-size: clamp(34px, 7vw, 48px); }
  h2.q { font-size: clamp(26px, 5.4vw, 34px); }
  .help { color: var(--espresso-soft); margin: 0 0 22px; font-size: 15px; }
  .intro p { margin: 0 0 14px; color: var(--espresso-soft); max-width: 34em; }

  .desc {
    background: var(--paper); border-left: 3px solid var(--gold);
    padding: 14px 16px; border-radius: 0 12px 12px 0; margin: 0 0 22px; font-size: 15px;
  }
  .desc b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--burnt-orange); margin-bottom: 4px; }

  .options { display: grid; gap: 10px; border: 0; padding: 0; margin: 0; }
  .opt { position: relative; display: block; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt span {
    display: flex; align-items: center; gap: 12px; min-height: 52px;
    padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
    cursor: pointer; font-size: 16px; line-height: 1.3;
  }
  .opt span::before {
    content: ""; flex: none; width: 18px; height: 18px; border: 1.5px solid #BFA893; background: #fff;
  }
  .opt input[type=radio] + span::before { border-radius: 50%; }
  .opt input[type=checkbox] + span::before { border-radius: 5px; }
  .opt input:checked + span { border-color: var(--burnt-orange); background: var(--paper); box-shadow: inset 0 0 0 1px var(--burnt-orange); }
  .opt input[type=radio]:checked + span::before { border: 5.5px solid var(--auburn); }
  .opt input[type=checkbox]:checked + span::before { background: var(--auburn); border-color: var(--auburn); box-shadow: inset 0 0 0 3px #fff; }
  .opt input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }

  .shades { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .shade { position: relative; display: block; }
  .shade input { position: absolute; opacity: 0; pointer-events: none; }
  .shade span {
    display: grid; justify-items: center; align-content: start; gap: 6px; height: 100%;
    padding: 10px 4px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
    text-align: center; font-size: 12px; font-weight: 500; line-height: 1.25; cursor: pointer;
  }
  .shade i { width: 34px; height: 34px; border-radius: 50%; display: block; border: 1px solid rgba(38,16,0,.12); }
  .shade input:checked + span { border-color: var(--burnt-orange); background: var(--paper); box-shadow: inset 0 0 0 1px var(--burnt-orange); }
  .shade input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
  .shade-none { grid-column: 1 / -1; }
  .shade-none span { grid-auto-flow: column; justify-content: center; align-items: center; }
  @media (max-width: 399px) { .shades { grid-template-columns: repeat(2, 1fr); } }

  .other { margin-top: 10px; }
  .other input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--espresso);
  }
  .other input:focus { border-color: var(--burnt-orange); outline: none; box-shadow: 0 0 0 3px rgba(228,165,36,.3); }

  .nav { display: flex; gap: 10px; align-items: center; margin-top: 28px; }
  .btn {
    font: inherit; font-weight: 700; font-size: 15px; letter-spacing: .03em;
    border-radius: 999px; padding: 14px 24px; cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--espresso); color: var(--warm-white); flex: 1; }
  .btn-primary:hover { background: var(--auburn); }
  .btn-primary[disabled] { opacity: .45; cursor: default; background: var(--espresso); }
  .btn-back { background: transparent; color: var(--espresso); border-color: var(--line); }
  .btn-back:hover { border-color: var(--espresso); }
  .skip { font-size: 13px; color: var(--espresso-soft); margin: 12px 0 0; text-align: center; }
  .error { color: var(--auburn); font-weight: 600; font-size: 14px; margin: 14px 0 0; }

  .end { text-align: left; }
  .end h1 { margin-bottom: 14px; }
  .end p { color: var(--espresso-soft); margin: 0 0 14px; max-width: 34em; }
  a.cta {
    display: inline-block; margin-top: 8px; text-decoration: none; font-weight: 700; letter-spacing: .03em;
    background: var(--grad); color: var(--warm-white); padding: 14px 26px; border-radius: 999px;
  }
  footer { border-top: 1px solid var(--line); padding-block: 20px; font-size: 13px; color: var(--espresso-soft); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
  // ---- Settings ----
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbxqre8bK-vNamqo9zud4tY_bEJlVosERZZ0tTNo6Nk4iCiglGLiMmII71ca7P4Nw8cr5Q/exec";
  // ------------------

  var SHADES = [
    ["Pearl","mst_1","#f6ede4"],["Selenite","mst_2","#f3e7db"],["Moonstone","mst_3","#f7ead0"],
    ["Citrine","mst_4","#eadaba"],["Amber","mst_5","#d7bd96"],["Tiger's Eye","mst_6","#a07e56"],
    ["Bronzite","mst_7","#825c43"],["Smoky Quartz","mst_8","#604134"],["Obsidian","mst_9","#3a312a"],["Onyx","mst_10","#292420"]
  ];

  var DESCRIPTION = "Pulse is an app that scans your face, builds a skincare routine around what it finds, and lets you rescan to see whether the routine is working. Every skin concern is tested across ten skin tones before it goes in the app, and the results are published.";

  // screen: true = answer required and can end the survey
  var QUESTIONS = [
    { id: "q1_age", type: "radio", screen: true, title: "How old are you?",
      options: [["under_22","Under 22"],["22_25","22–25"],["26_30","26–30"],["31_35","31–35"],["over_35","Over 35"]],
      disqualify: ["under_22","over_35"] },
    { id: "q2_us", type: "radio", screen: true, title: "Do you live in the United States?",
      options: [["yes","Yes"],["no","No"]], disqualify: ["no"] },
    { id: "q3_bought", type: "radio", screen: true, title: "In the last six months, have you bought any skincare product for your face?",
      help: "For example a cleanser, moisturizer, serum or sunscreen.",
      options: [["yes","Yes"],["no","No"]], disqualify: ["no"] },
    { id: "q4_shade", type: "shade", title: "Which shade is closest to the skin on your face?",
      help: "Choose the one that looks closest. There's no wrong answer." },
    { id: "q5_concerns", type: "checkbox", title: "Which skin concerns do you want to improve?",
      help: "Choose all that apply.",
      options: [["dark_spots","Dark spots or hyperpigmentation"],["post_acne_marks","Post-acne marks"],["acne","Breakouts or acne"],
        ["uneven_tone","Uneven tone"],["redness","Redness"],["dryness","Dryness"],["oiliness","Oiliness"],
        ["enlarged_pores","Enlarged pores"],["texture","Texture"],["fine_lines","Fine lines"],["dark_circles","Dark circles"],
        ["razor_bumps","Razor bumps"],["sensitivity","Sensitivity"],["other","Something else"]],
      other: "q5_other", otherLabel: "What else?" },
    { id: "q6_scanned", type: "radio", title: "Has an app, website or in-store tool ever analyzed your skin?",
      options: [["yes_right","Yes, and the results seemed right"],["yes_wrong","Yes, and the results seemed wrong"],
        ["yes_unsure","Yes, and I couldn't tell"],["never","No, never"]] },
    { id: "q7_routine", type: "radio", title: "Which best describes your skincare?",
      options: [["multi_step_daily","I follow the same multi-step routine most days"],["routine_skipped","I have a routine but skip it often"],
        ["when_remember","I use products when I remember, with no set routine"],["rarely","I rarely use skincare"]] },
    { id: "q8_spend", type: "radio", title: "About how much do you spend on skincare in a typical month?",
      options: [["under_25","Under $25"],["25_50","$25–$50"],["51_100","$51–$100"],["101_200","$101–$200"],
        ["over_200","Over $200"],["prefer_not","Prefer not to say"]] },
    { id: "q9_confidence", type: "radio", title: "How confident are you that the products you use are actually working for your skin?",
      options: [["very","Very confident"],["somewhat","Somewhat confident"],["not_very","Not very confident"],["not_at_all","Not at all confident"]] },
    { id: "q10_interest", type: "radio", describe: true, title: "How interested would you be in using Pulse?",
      options: [["very","Very interested"],["somewhat","Somewhat interested"],["not_very","Not very interested"],["not_at_all","Not at all interested"]] },
    { id: "q11_accuracy", type: "radio", describe: true, title: "How much would it matter to you that the scan is tested to be accurate on your skin tone?",
      options: [["main_reason","It would be a main reason I'd use it"],["somewhat","It would matter somewhat"],["not_much","It wouldn't matter much"]] },
    { id: "q12_price", type: "radio", describe: true,
      title: "Premium costs $59.99 a year (about $5 a month) or $9.99 month to month. Which is closest to what you'd do?",

    { id: "q13_copied", type: "radio", title: "Have you ever copied a skincare routine or product from a friend, family member or creator?",

    { id: "q14_professional", type: "radio", title: "Do you see an esthetician, dermatologist or other skin professional?",

    { id: "q14b_share", type: "radio", title: "Would you share your skin progress in Pulse with them?",

      options: [["yes","Yes"],["maybe","Maybe"],["no","No"]] },
    { id: "q15_gender", type: "radio", section: "About you", title: "How do you describe your gender?",
      options: [["woman","Woman"],["man","Man"],["non_binary","Non-binary"],["another","I describe my gender another way"],["prefer_not","Prefer not to say"]],
      other: "q15_other", otherWhen: "another", otherLabel: "How do you describe it? (optional)" },
    { id: "q16_income", type: "radio", section: "About you", title: "What is your household income before taxes?",
      help: "Optional.",
      options: [["under_50k","Under $50,000"],["50_99k","$50,000–$99,999"],["100_149k","$100,000–$149,999"],["150k_plus","$150,000 or more"],["prefer_not","Prefer not to say"]] }
  ];

  var app = document.getElementById("app");
  var bar = document.getElementById("bar");
  var stepCount = document.getElementById("stepCount");
  var answers = {};
  var others = {};
  var idx = -1; // -1 = intro
  var trail = [];

  function source() {
    try {
      var s = new URLSearchParams(window.location.search).get("src") || "";
      s = s.toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 30);
      return s || "direct";
    } catch (e) { return "direct"; }
  }
  var SRC = source();

  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function visible(q) { return !q.showIf || q.showIf(answers); }
  function totalVisible() { return QUESTIONS.filter(visible).length; }
  function position(i) { var n = 0; for (var k = 0; k <= i; k++) if (visible(QUESTIONS[k])) n++; return n; }

  function setProgress() {
    if (idx < 0) { bar.style.width = "0%"; stepCount.textContent = ""; return; }
    if (idx >= QUESTIONS.length) { bar.style.width = "100%"; stepCount.textContent = ""; return; }
    var p = position(idx), t = totalVisible();
    bar.style.width = Math.round((p - 1) / t * 100) + "%";
    stepCount.textContent = p + " of " + t;
  }

  function intro() {
    idx = -1; setProgress();
    app.innerHTML =
      '<section class="intro">' +
      '<p class="eyebrow">Pulse skin survey</p>' +
      '<h1>Help shape what Pulse becomes.</h1>' +
      '<p>About five minutes and 16 or so short questions. Your skin, your routine and what you would want from a skincare app.</p>' +
      '<p>After the first three, every question is optional. Answers are anonymous: we don’t ask for your name or email.</p>' +
      '<div class="nav"><button class="btn btn-primary" id="start" type="button">Start the survey</button></div>' +
      '</section>';
    document.getElementById("start").onclick = function () { go(0); };
  }

  function renderOptions(q) {
    if (q.type === "shade") {
      var h = '<div class="shades" role="radiogroup" aria-labelledby="qtitle">';
      SHADES.forEach(function (s) {
        var id = "o_" + s[1];
        h += '<label class="shade" for="' + id + '"><input type="radio" name="opt" id="' + id + '" value="' + s[1] + '"' +
          (answers[q.id] === s[1] ? " checked" : "") + '><span><i style="background:' + s[2] + '"></i>' + esc(s[0]) + '</span></label>';
      });
      h += '<label class="shade shade-none" for="o_prefer_not"><input type="radio" name="opt" id="o_prefer_not" value="prefer_not"' +
        (answers[q.id] === "prefer_not" ? " checked" : "") +
        '><span><i style="background:repeating-linear-gradient(45deg,#FFF3E8 0 4px,#E7D6C8 4px 8px)"></i>Prefer not to say</span></label></div>';
      return h;
    }
    var multi = q.type === "checkbox";
    var cur = answers[q.id];
    var h2 = '<div class="options" role="' + (multi ? "group" : "radiogroup") + '" aria-labelledby="qtitle">';
    q.options.forEach(function (o, n) {
      var id = "o_" + n;
      var on = multi ? (cur || []).indexOf(o[0]) !== -1 : cur === o[0];
      h2 += '<label class="opt" for="' + id + '"><input type="' + (multi ? "checkbox" : "radio") + '" name="opt" id="' + id +
        '" value="' + o[0] + '"' + (on ? " checked" : "") + '><span>' + esc(o[1]) + '</span></label>';
    });
    h2 += '</div>';
    if (q.other) {
      h2 += '<div class="other" id="otherWrap" hidden><label for="otherInput" class="help" style="display:block;margin:0 0 6px">' +
        esc(q.otherLabel) + '</label><input id="otherInput" type="text" maxlength="80" value="' + esc(others[q.other] || "") + '"></div>';
    }
    return h2;
  }

  function currentValue(q) {
    if (q.type === "checkbox") {
      return Array.prototype.map.call(app.querySelectorAll('input[name=opt]:checked'), function (el) { return el.value; });
    }
    var el = app.querySelector('input[name=opt]:checked');
    return el ? el.value : "";
  }

  function showQuestion() {
    var q = QUESTIONS[idx];
    setProgress();
    var isLast = position(idx) === totalVisible();
    app.innerHTML =
      '<section>' +
      '<p class="eyebrow">' + esc(q.section || (q.screen ? "A few quick checks" : "Your skin and routine")) + '</p>' +
      (q.describe ? '<div class="desc"><b>About Pulse</b>' + esc(DESCRIPTION) + '</div>' : '') +
      '<h2 class="q" id="qtitle" tabindex="-1">' + esc(q.title) + '</h2>' +
      (q.help ? '<p class="help">' + esc(q.help) + '</p>' : '<div style="height:12px"></div>') +
      renderOptions(q) +
      '<p class="error" id="err" hidden></p>' +
      '<div class="nav">' +
      '<button class="btn btn-back" type="button" id="back">Back</button>' +
      '<button class="btn btn-primary" type="button" id="next">' + (isLast ? "Submit" : "Next") + '</button>' +
      '</div>' +
      (q.screen ? '' : '<p class="skip">You can skip any question.</p>') +
      '</section>';

    var next = document.getElementById("next");
    var otherWrap = document.getElementById("otherWrap");
    function sync() {
      var v = currentValue(q);
      if (q.screen) next.disabled = !v;
      if (otherWrap) {
        var show = q.type === "checkbox" ? v.indexOf("other") !== -1 : v === q.otherWhen;
        otherWrap.hidden = !show;
      }
    }
    app.querySelectorAll('input[name=opt]').forEach(function (el) { el.addEventListener("change", sync); });
    sync();
    document.getElementById("back").onclick = back;
    next.onclick = function () { advance(q); };
    try { document.getElementById("qtitle").focus({ preventScroll: true }); } catch (e) {}
    window.scrollTo(0, 0);
  }

  function advance(q) {
    var v = currentValue(q);
    answers[q.id] = v;
    if (q.other) {
      var inp = document.getElementById("otherInput");
      var keep = q.type === "checkbox" ? v.indexOf("other") !== -1 : v === q.otherWhen;
      others[q.other] = keep && inp ? inp.value.trim() : "";
    }
    if (q.screen && q.disqualify && q.disqualify.indexOf(v) !== -1) { screenedOut(); return; }
    var n = idx + 1;
    while (n < QUESTIONS.length && !visible(QUESTIONS[n])) n++;
    if (n >= QUESTIONS.length) { submit(); return; }
    trail.push(idx);
    go(n, true);
  }

  function go(i, fromAdvance) {
    if (!fromAdvance && idx >= 0) trail.push(idx);
    idx = i; showQuestion();
  }

  function back() {
    if (!trail.length) { intro(); return; }
    idx = trail.pop(); showQuestion();
  }

  function endScreen(title, lines, withCta) {
    idx = QUESTIONS.length; setProgress();
    app.innerHTML = '<section class="end"><p class="eyebrow">Pulse skin survey</p><h1 tabindex="-1" id="endTitle">' + esc(title) + '</h1>' +
      lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join("") +
      (withCta ? '<a class="cta" href="/">Join the Pulse waitlist</a>' : '') + '</section>';
    try { document.getElementById("endTitle").focus({ preventScroll: true }); } catch (e) {}
    window.scrollTo(0, 0);
  }

  function screenedOut() {
    endScreen("Thank you for your time.",
      ["This survey is for a specific group of people, so we won’t need any more answers from you. Nothing you entered has been saved."], true);
  }

  function responseId() {
    var a = new Uint32Array(2);
    try { crypto.getRandomValues(a); } catch (e) { a[0] = Date.now(); a[1] = Math.random() * 1e9; }
    return a[0].toString(36) + a[1].toString(36);
  }

  function submit() {
    var payload = { form: "survey", source: SRC, response_id: responseId(), submitted_at: new Date().toISOString() };
    QUESTIONS.forEach(function (q) {
      var v = answers[q.id];
      payload[q.id] = Array.isArray(v) ? v.join(";") : (visible(q) ? (v || "") : "");
      if (q.other) payload[q.other] = others[q.other] || "";
    });
    app.innerHTML = '<section><h2 class="q">Sending your answers…</h2></section>';
    fetch(ENDPOINT, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      endScreen("Thank you. That’s everything.",
        ["Your answers go straight into decisions being made right now: which skin concerns Pulse checks first, what it costs, and what it has to prove before it tells you anything.",
         "If you’re not on the waitlist yet, you can join below."], true);
    }).catch(function () {
      app.innerHTML = '<section><h2 class="q">We couldn’t send your answers.</h2>' +
        '<p class="help">Check your connection, then try again. Your answers are still here.</p>' +
        '<div class="nav"><button class="btn btn-primary" type="button" id="retry">Try again</button></div></section>';
      document.getElementById("retry").onclick = submit;
    });
  }

  intro();
</script>
</body>
</html>
